<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar itens · AlugaFácil</title>
  <meta name="description" content="Busque itens para alugar perto de você.">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-menu="buscar">
  <!-- Cabeçalho, menu do celular e rodapé são montados pelo assets/js/main.js -->
  <header class="cabecalho"></header>

  <main class="pagina">
    <!-- T14 Busca, T14b Filtros, T14c Sem resultados (visitante e logado) -->
    <section class="faixa">
      <div class="container">
        <nav class="trilha" aria-label="Você está em"><a href="../../index.html">Início</a><span class="trilha__sep"></span><span>Buscar</span></nav>
        <h1>Buscar itens</h1>
        <p class="faixa__texto">Encontre o que você precisa perto de você.</p>
        <form class="busca-barra" id="busca-form" role="search">
          <label class="visualmente-oculto" for="busca-q">O que você procura?</label>
          <span class="icone icone--buscar busca-barra__icone" aria-hidden="true"></span>
          <input class="campo__caixa busca-barra__campo" id="busca-q" name="q" type="search" placeholder="Ex.: furadeira, barraca, projetor">
          <button class="botao botao--primario" type="submit">Buscar</button>
        </form>
      </div>
    </section>

    <div class="container conteudo">
      <div class="busca">
        <aside class="busca__filtros" id="busca-filtros" aria-label="Filtros">
          <div class="filtros__topo">
            <p class="filtros__titulo">Filtros</p>
            <button class="link-botao" type="button" id="busca-limpar">Limpar</button>
          </div>

          <fieldset class="filtro">
            <legend class="filtro__titulo">Categoria</legend>
            <div class="filtro__opcoes" id="busca-categorias"></div>
          </fieldset>

          <div class="filtro">
            <label class="filtro__titulo" for="busca-bairro">Região</label>
            <select class="campo__caixa" id="busca-bairro" name="bairro">
              <option value="">Todos os bairros</option>
            </select>
          </div>

          <fieldset class="filtro">
            <legend class="filtro__titulo">Preço da diária</legend>
            <div class="linha-campos linha-campos--sempre">
              <div class="campo">
                <label class="campo__rotulo" for="busca-min">Mínimo</label>
                <input class="campo__caixa" id="busca-min" name="min" type="number" min="0" step="1" placeholder="R$ 0">
              </div>
              <div class="campo">
                <label class="campo__rotulo" for="busca-max">Máximo</label>
                <input class="campo__caixa" id="busca-max" name="max" type="number" min="0" step="1" placeholder="R$ 200">
              </div>
            </div>
          </fieldset>

          <fieldset class="filtro">
            <legend class="filtro__titulo">Disponibilidade</legend>
            <p class="campo__ajuda">Mostra só itens livres em todo o período.</p>
            <div class="pilha pilha--estreita">
              <div class="campo">
                <label class="campo__rotulo" for="busca-inicio">De</label>
                <input class="campo__caixa" id="busca-inicio" name="inicio" type="date">
              </div>
              <div class="campo">
                <label class="campo__rotulo" for="busca-fim">Até</label>
                <input class="campo__caixa" id="busca-fim" name="fim" type="date">
              </div>
            </div>
          </fieldset>

          <button class="botao botao--primario botao--bloco so-celular" type="button" id="busca-aplicar">Ver resultados</button>
        </aside>

        <section class="busca__resultados" aria-labelledby="busca-total">
          <div class="busca__barra">
            <button class="botao botao--contorno botao--compacto so-celular" type="button" id="busca-abrir-filtros" aria-expanded="false" aria-controls="busca-filtros">
              <span class="icone icone--filtro" aria-hidden="true"></span> Filtros <span id="busca-qtd-filtros"></span>
            </button>
            <h2 class="busca__total" id="busca-total" aria-live="polite">Carregando…</h2>
            <label class="busca__ordem">
              <span>Ordenar:</span>
              <select class="campo__caixa" id="busca-ordem" name="ordem">
                <option value="relevancia">Relevância</option>
                <option value="recentes">Mais recentes</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="nota">Melhor avaliados</option>
              </select>
            </label>
          </div>
          <ul class="chips busca__ativos" id="busca-ativos"></ul>
          <div class="lista-cards" id="busca-lista"></div>
          <div class="estado-vazio" id="busca-vazio" hidden>
            <span class="estado-vazio__icone"><span class="icone icone--buscar" aria-hidden="true"></span></span>
            <p class="estado-vazio__titulo">Nenhum item encontrado</p>
            <p>Tente remover alguns filtros ou buscar outro termo.</p>
            <button class="botao botao--contorno" type="button" id="busca-limpar-vazio">Limpar filtros</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="../../assets/js/utils/formatacao.js" defer></script>
  <script src="../../assets/js/utils/dados.js" defer></script>
  <script src="../../assets/js/utils/usuarios.js" defer></script>
  <script src="../../assets/js/utils/anuncios.js" defer></script>
  <script src="../../assets/js/utils/alugueis.js" defer></script>
  <script src="../../assets/js/utils/notificacoes.js" defer></script>
  <script src="../../assets/js/utils/avisos.js" defer></script>
  <script src="../../assets/js/utils/validacao.js" defer></script>
  <script src="../../assets/js/components/card-anuncio.js" defer></script>
  <script src="../../assets/js/main.js" defer></script>
  <script src="../../assets/js/pages/busca.js" defer></script>
</body>
</html>
