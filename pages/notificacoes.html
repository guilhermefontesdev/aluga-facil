<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações · AlugaFácil</title>
  <meta name="description" content="Suas notificações do AlugaFácil.">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-menu="notificacoes" data-acesso="privado">
  <!-- Cabeçalho, menu do celular e rodapé são montados pelo assets/js/main.js -->
  <header class="cabecalho"></header>

  <main class="pagina">
    <section class="faixa">
      <div class="container faixa__conteudo">
        <div>
          <nav class="trilha" aria-label="Você está em"><a href="../index.html">Início</a><span class="trilha__sep"></span><span>Notificações</span></nav>
          <h1>Notificações</h1>
          <p class="faixa__texto" id="notificacoes-resumo"></p>
        </div>
        <div class="faixa__acoes">
          <button class="botao botao--contorno" type="button" id="notificacoes-lidas"><span class="icone icone--check" aria-hidden="true"></span> Marcar todas como lidas</button>
        </div>
      </div>
    </section>

    <div class="container conteudo">
      <div class="duas-colunas duas-colunas--lateral-esquerda">
        <aside class="painel notificacoes__filtros">
          <p class="filtros__titulo">Mostrar</p>
          <div class="filtro__opcoes" role="radiogroup" id="notificacoes-filtro">
            <label class="filtro__opcao"><input type="radio" name="filtro" value="todas" checked> Todas</label>
            <label class="filtro__opcao"><input type="radio" name="filtro" value="nao-lidas"> Não lidas</label>
            <label class="filtro__opcao"><input type="radio" name="filtro" value="alugueis"> Aluguéis</label>
            <label class="filtro__opcao"><input type="radio" name="filtro" value="avaliacoes"> Avaliações</label>
          </div>
        </aside>
        <section>
          <div class="notificacoes" id="notificacoes-lista"></div>
          <div class="estado-vazio" id="notificacoes-vazio" hidden>
            <span class="estado-vazio__icone"><span class="icone icone--sino" aria-hidden="true"></span></span>
            <p class="estado-vazio__titulo">Nada por aqui</p>
            <p>Quando alguém pedir um item seu ou responder um pedido, o aviso aparece aqui.</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="../assets/js/utils/formatacao.js" defer></script>
  <script src="../assets/js/utils/dados.js" defer></script>
  <script src="../assets/js/utils/usuarios.js" defer></script>
  <script src="../assets/js/utils/anuncios.js" defer></script>
  <script src="../assets/js/utils/alugueis.js" defer></script>
  <script src="../assets/js/utils/notificacoes.js" defer></script>
  <script src="../assets/js/utils/avisos.js" defer></script>
  <script src="../assets/js/utils/validacao.js" defer></script>
  <script src="../assets/js/components/card-anuncio.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/pages/notificacoes.js" defer></script>
</body>
</html>
