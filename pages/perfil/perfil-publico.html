<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil público · AlugaFácil</title>
  <meta name="description" content="Perfil público de quem anuncia e aluga no AlugaFácil.">
  <link rel="icon" type="image/png" href="../../assets/img/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/img/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
  <!-- Cabeçalho, menu do celular e rodapé são montados pelo assets/js/main.js -->
  <header class="cabecalho"></header>

  <main class="pagina">
    <!-- T10 Perfil público (visitante e logado) -->
    <div class="container conteudo" id="publico">
      <nav class="trilha" aria-label="Você está em"><a href="../../index.html">Início</a><span class="trilha__sep"></span><span>Perfil público</span></nav>
      <section class="painel publico__topo">
        <div id="publico-avatar"></div>
        <div class="publico__dados">
          <h1 id="publico-nome"></h1>
          <p class="publico__local" id="publico-local"></p>
          <p class="publico__apresentacao" id="publico-apresentacao"></p>
        </div>
        <ul class="publico__numeros" id="publico-numeros"></ul>
      </section>

      <div class="duas-colunas duas-colunas--lateral-esquerda publico__corpo">
        <aside class="painel">
          <div class="abas" role="tablist" id="publico-abas">
            <button class="aba" role="tab" type="button" data-papel="anunciante" aria-selected="true">Anunciante</button>
            <button class="aba" role="tab" type="button" data-papel="locatario" aria-selected="false">Locatário</button>
          </div>
          <div class="publico__reputacao" id="publico-reputacao"></div>
          <ul class="avaliacoes" id="publico-avaliacoes"></ul>
          <p class="campo__ajuda">O histórico completo é visível apenas para o próprio usuário.</p>
        </aside>
        <section>
          <div class="secao__topo">
            <h2 class="secao__titulo" id="publico-titulo-anuncios">Anúncios</h2>
          </div>
          <div class="lista-cards" id="publico-anuncios"></div>
          <p class="estado-vazio" id="publico-sem-anuncios" hidden>Nenhum anúncio ativo no momento.</p>
        </section>
      </div>
    </div>
    <div class="container conteudo" id="publico-nao-encontrado" hidden>
      <div class="estado-vazio">
        <p class="estado-vazio__titulo">Perfil não encontrado</p>
        <a class="botao botao--primario" href="../anuncios/busca.html">Buscar itens</a>
      </div>
    </div>
  </main>

  <script src="../../assets/js/utils/formatacao.js" defer></script>
  <script src="../../assets/js/utils/dados.js" defer></script>
  <script src="../../assets/js/utils/usuarios.js" defer></script>
  <script src="../../assets/js/utils/anuncios.js" defer></script>
  <script src="../../assets/js/utils/alugueis.js" defer></script>
  <script src="../../assets/js/utils/notificacoes.js" defer></script>
  <script src="../../assets/js/utils/avisos.js" defer></script>
  <script src="../../assets/js/utils/validacao.js" defer></script>
  <script src="../../assets/js/components/card-anuncio.js" defer></script>
  <script src="../../assets/js/main.js" defer></script>
  <script src="../../assets/js/pages/perfil-publico.js" defer></script>
</body>
</html>
