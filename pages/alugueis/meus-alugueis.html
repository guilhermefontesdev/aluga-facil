<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus aluguéis · AlugaFácil</title>
  <meta name="description" content="Acompanhe os itens que você aluga e os que você anuncia.">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-menu="alugueis" data-acesso="privado">
  <!-- Cabeçalho, menu do celular e rodapé são montados pelo assets/js/main.js -->
  <header class="cabecalho"></header>

  <main class="pagina">
    <section class="faixa">
      <div class="container faixa__conteudo">
        <div>
          <nav class="trilha" aria-label="Você está em"><a href="../../index.html">Início</a><span class="trilha__sep"></span><span>Meus aluguéis</span></nav>
          <h1>Meus aluguéis</h1>
          <p class="faixa__texto">Pedidos que você fez e pedidos que recebeu nos seus anúncios.</p>
        </div>
        <ul class="numeros" id="alugueis-numeros"></ul>
      </div>
    </section>

    <div class="container conteudo">
      <div class="alugueis__barra" id="alugueis-barra">
        <div class="abas" role="tablist" id="alugueis-abas">
          <button class="aba" role="tab" type="button" data-papel="todos" aria-selected="true">Todos</button>
          <button class="aba" role="tab" type="button" data-papel="locatario" aria-selected="false">Locatário</button>
          <button class="aba" role="tab" type="button" data-papel="anunciante" aria-selected="false">Anunciante</button>
        </div>
        <label class="alugueis__filtro">
          <span>Status:</span>
          <select class="campo__caixa" id="alugueis-status">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="aceito">Aceito</option>
            <option value="em-andamento">Em andamento</option>
            <option value="devolucao">Aguardando devolução</option>
            <option value="concluido">Concluído</option>
            <option value="recusado">Recusado</option>
            <option value="cancelado">Cancelado</option>
            <option value="expirado">Expirado</option>
          </select>
        </label>
      </div>

      <ul class="linhas" id="alugueis-lista"></ul>

      <div class="estado-vazio" id="alugueis-vazio" hidden>
        <span class="estado-vazio__icone"><span class="icone icone--calendario" aria-hidden="true"></span></span>
        <p class="estado-vazio__titulo">Você ainda não possui aluguéis</p>
        <p>Quando você alugar ou anunciar um item, ele aparece aqui.</p>
        <div class="acoes">
          <a class="botao botao--primario" href="../anuncios/busca.html">Buscar itens</a>
          <a class="botao botao--contorno" href="../anuncios/anunciar.html">Anunciar item</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../../assets/js/utils/formatacao.js" defer></script>
  <script src="../../assets/js/utils/dados.js" defer></script>
  <script src="../../assets/js/utils/usuarios.js" defer></script>
  <script src="../../assets/js/utils/anuncios.js" defer></script>
  <script src="../../assets/js/utils/alugueis.js" defer></script>
  <script src="../../assets/js/utils/notificacoes.js" defer></script>
  <script src="../../assets/js/utils/avisos.js" defer></script>
  <script src="../../assets/js/utils/validacao.js" defer></script>
  <script src="../../assets/js/components/card-anuncio.js" defer></script>
  <script src="../../assets/js/main.js" defer></script>
  <script src="../../assets/js/pages/meus-alugueis.js" defer></script>
</body>
</html>
