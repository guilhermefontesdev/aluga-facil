<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar aluguel · AlugaFácil</title>
  <meta name="description" content="Confira a multa antes de cancelar.">
  <link rel="icon" type="image/png" href="../../assets/img/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/img/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-menu="alugueis" data-acesso="privado">
  <!-- Cabeçalho, menu do celular e rodapé são montados pelo assets/js/main.js -->
  <header class="cabecalho"></header>

  <main class="pagina">
    <section class="faixa">
      <div class="container">
        <nav class="trilha" aria-label="Você está em"><a href="../../index.html">Início</a><span class="trilha__sep"></span><a href="meus-alugueis.html">Meus aluguéis</a><span class="trilha__sep"></span><span>Cancelar</span></nav>
        <h1>Cancelar aluguel</h1>
        <p class="faixa__texto">Confira a multa antes de confirmar.</p>
      </div>
    </section>

    <div class="container conteudo">
      <form class="duas-colunas" id="cancelar-form" novalidate>
        <div class="pilha">
          <section class="painel">
            <div class="item-resumo">
              <span id="cancelar-foto"></span>
              <div>
                <p class="item-resumo__nome" id="cancelar-item"></p>
                <p class="item-resumo__detalhe" id="cancelar-com"></p>
              </div>
            </div>
          </section>
          <section class="painel">
            <h2 class="painel__titulo">Política: <span id="cancelar-politica-nome"></span></h2>
            <p class="painel__texto" id="cancelar-politica"></p>
            <div class="faixas-multa" id="cancelar-faixas"></div>
          </section>
          <section class="painel">
            <div class="campo">
              <label class="campo__rotulo" for="motivo">Motivo do cancelamento</label>
              <select class="campo__caixa" id="motivo" name="motivo">
                <option value="">Escolha um motivo</option>
                <option>Não vou mais precisar do item</option>
                <option>Encontrei outra opção</option>
                <option>Mudança de datas</option>
                <option>Outro motivo</option>
              </select>
              <p class="campo__ajuda">O anunciante vê o motivo junto com o aviso de cancelamento.</p>
            </div>
          </section>
        </div>
        <aside class="lateral-fixa">
          <section class="painel painel--sombra pilha">
            <h2 class="painel__titulo">Valores</h2>
            <p class="painel__texto" id="cancelar-faltam"></p>
            <dl class="resumo">
              <div class="resumo__linha"><dt>Valor da locação</dt><dd id="cancelar-total"></dd></div>
              <div class="resumo__linha resumo__total"><dt id="cancelar-multa-rotulo">Multa</dt><dd id="cancelar-multa"></dd></div>
            </dl>
            <p class="reserva__nota">Se houver multa, ela fica registrada aqui e é combinada diretamente entre vocês.</p>
            <button class="botao botao--perigo botao--bloco" type="submit">Confirmar cancelamento</button>
            <a class="botao botao--contorno botao--bloco" id="cancelar-manter" href="meus-alugueis.html">Manter aluguel</a>
          </section>
        </aside>
      </form>
    </div>
  </main>

  <script src="../../assets/js/utils/formatacao.js" defer></script>
  <script src="../../assets/js/utils/dados.js" defer></script>
  <script src="../../assets/js/utils/usuarios.js" defer></script>
  <script src="../../assets/js/utils/anuncios.js" defer></script>
  <script src="../../assets/js/utils/alugueis.js" defer></script>
  <script src="../../assets/js/utils/notificacoes.js" defer></script>
  <script src="../../assets/js/utils/avisos.js" defer></script>
  <script src="../../assets/js/utils/validacao.js" defer></script>
  <script src="../../assets/js/components/card-anuncio.js" defer></script>
  <script src="../../assets/js/main.js" defer></script>
  <script src="../../assets/js/pages/cancelar-aluguel.js" defer></script>
</body>
</html>
